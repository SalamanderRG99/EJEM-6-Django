<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Sistema de Alunos{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      min-height: 100vh;
      color: #fff;
      background: linear-gradient(135deg, #1e1b4b, #7c3aed, #ec4899);
      background-attachment: fixed;
      padding: 40px 20px;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    h1 {
      font-size: 2.6rem;
      text-align: center;
      margin-bottom: 10px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
    }

    .subtitulo {
      text-align: center;
      opacity: 0.85;
      margin-bottom: 35px;
      font-size: 1.1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      margin-bottom: 35px;
    }

    .card {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .card:hover {
      transform: translateY(-8px) rotate(-1deg);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
    }

    .emoji { font-size: 3.5rem; margin-bottom: 10px; }
    .card h3 { font-size: 1.4rem; margin-bottom: 6px; }

    .curso {
      display: inline-block;
      background: #fbbf24;
      color: #1e1b4b;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .card p { opacity: 0.92; line-height: 1.5; margin-bottom: 18px; }

    .btn {
      display: inline-block;
      background: #fff;
      color: #7c3aed;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 26px;
      border-radius: 999px;
      transition: transform 0.2s, background 0.2s, color 0.2s;
    }

    .btn:hover { transform: scale(1.08); background: #fbbf24; color: #1e1b4b; }

    .centro { text-align: center; }

    .detalhe { max-width: 520px; margin: 0 auto 30px; padding: 40px 30px; }
    .detalhe .emoji { font-size: 6rem; }
    .detalhe p { font-size: 1.15rem; }
  </style>
</head>
<body>
  <div class="container">
    {% block conteudo %}{% endblock %}
  </div>
</body>
</html>
