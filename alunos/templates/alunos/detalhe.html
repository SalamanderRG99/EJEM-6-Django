{% extends "alunos/base.html" %}

{% block titulo %}{{ aluno.nome }}{% endblock %}

{% block conteudo %}
  <div class="card detalhe">
    <h1>{{ aluno.nome }}</h1>
    <span class="curso">{{ aluno.curso }}</span>
    <p>{{ aluno.descricao }}</p>
  </div>

  <div class="centro">
    <a class="btn" href="{% url 'lista' %}">← Voltar para a lista</a>
  </div>
{% endblock %}
